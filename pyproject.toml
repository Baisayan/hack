[project]
name = "hack"
version = "0.1.0"
description = "Reproducible activation probing for small language-model safety"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "safetensors>=0.4.5,<1",
    "torch>=2.5,<3",
    "transformers>=4.57.6,<5",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
